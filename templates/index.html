<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analyst Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>Analyst Chatbot</h1>
            <button id="clear-btn" class="clear-btn">Clear Context</button>
        </header>
        <div id="chat-messages" class="chat-messages">
            <div class="message assistant"><div class="bubble">Hello! Ask me business questions like: "What is the OSA of Blinkit in Mumbai?"</div></div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask a question..." autocomplete="off" />
            <button id="send-btn">Send</button>
        </div>
    </div>
    
    <div class="debug-container">
        <h3>Generated SQL Debug:</h3>
        <pre id="debug-sql">No SQL generated yet.</pre>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
